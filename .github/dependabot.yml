version: 2

# Monthly, and grouped. Five runtime dependencies do not justify a stream of
# individual pull requests, but ruff is pinned to an exact version on purpose
# and a pin nothing ever proposes bumping is just a stale dependency with a
# tidier justification. CI validates each bump before it is merged.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ""

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ""
