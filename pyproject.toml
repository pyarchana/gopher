[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopher-mcp"
version = "0.1.0"
description = "An MCP server that fetches, caches, and digests context for Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/pyarchana/gopher"

[project.scripts]
gopher = "gopher.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gopher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
